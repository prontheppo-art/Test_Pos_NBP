<!-- ไฟล์: location_zone.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>เลือกสถานที่ / โซน</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabaseClient.js"></script>
    <style>
        html, body { 
            background-color: #ffffff; 
            color: #1e293b; 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 12px; 
            width: 100%; height: 100%; 
            box-sizing: border-box;
            overflow: hidden;
        }
    </style>
</head>
<body class="flex flex-col h-full overflow-hidden">

    <!-- หน้า 1: เลือกสถานที่ -->
    <div id="locationView" class="flex flex-col h-full overflow-hidden">
        <div class="pb-2 border-b mb-3 flex-shrink-0">
            <h3 class="font-bold text-sm text-slate-800 mb-2">📍 เลือกสถานที่ / ที่พัก</h3>
            <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200 flex gap-2">
                <input type="text" id="newLocationInput" placeholder="➕ เพิ่มสถานที่ใหม่..." class="flex-1 h-9 px-3 text-xs rounded-lg border border-amber-300 bg-white outline-none">
                <button type="button" onclick="addNewLocation()" class="h-9 px-4 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-lg transition">+ เพิ่ม</button>
            </div>
        </div>
        <div id="locationGrid" class="grid grid-cols-2 gap-2 overflow-y-auto pr-1 flex-1 content-start"></div>
    </div>

    <!-- หน้า 2: เลือกโซน -->
    <div id="zoneView" class="flex flex-col h-full overflow-hidden hidden">
        <div class="pb-2 border-b mb-3 flex-shrink-0">
            <div class="flex items-center justify-between mb-2">
                <div>
                    <h3 class="font-bold text-sm text-slate-800">🏷️ เลือกโซน / ห้องพัก</h3>
                    <span id="zoneModalSubTitle" class="text-xs text-amber-600 font-semibold block">📍 สถานที่: -</span>
                </div>
                <button type="button" onclick="backToLocations()" class="text-xs text-blue-600 font-bold underline cursor-pointer">⬅ เปลี่ยนสถานที่</button>
            </div>
            <div class="bg-blue-50 p-2.5 rounded-xl border border-blue-200 flex gap-2">
                <input type="text" id="newZoneInput" placeholder="➕ เพิ่มโซนใหม่..." class="flex-1 h-9 px-3 text-xs rounded-lg border border-blue-300 bg-white outline-none">
                <button type="button" onclick="addNewZone()" class="h-9 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg transition">+ เพิ่ม</button>
            </div>
        </div>
        <!-- ใช้ h-11 บังคับความสูงปุ่มให้เตี้ยกะทัดรัด และ content-start ป้องกันไม่ให้ปุ่มยืดขยายสูงเกินไป -->
        <div id="zoneContainer" class="grid grid-cols-3 gap-2 overflow-y-auto pr-1 flex-1 content-start"></div>
    </div>

    <script>
        let locationsData = [];
        let zonesData = [];
        let tempSelectedLocation = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchLocationsAndZones();
            renderLocations();
        });

        async function fetchLocationsAndZones() {
            if (typeof supabaseClient !== 'undefined') {
                const [locRes, zoneRes] = await Promise.all([
                    supabaseClient.from('locations').select('*').order('location_name', { ascending: true }),
                    supabaseClient.from('location_zone').select('*').order('zone_name', { ascending: true })
                ]);
                if (locRes.data) locationsData = locRes.data;
                if (zoneRes.data) zonesData = zoneRes.data;
            }
        }

        function renderLocations() {
            document.getElementById('locationView').classList.remove('hidden');
            document.getElementById('zoneView').classList.add('hidden');
            const grid = document.getElementById('locationGrid');
            grid.innerHTML = '';

            locationsData.forEach(loc => {
                const btn = document.createElement('button');
                btn.type = 'button';
                // กำหนดความสูงปุ่มสถานที่ให้พอดี (h-11)
                btn.className = 'h-11 px-2.5 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl text-center font-bold text-xs transition cursor-pointer flex items-center justify-center gap-1';
                btn.innerHTML = `🏨 ${loc.location_name}`;
                btn.onclick = () => {
                    tempSelectedLocation = loc;
                    renderZones(loc);
                };
                grid.appendChild(btn);
            });
        }

        function renderZones(loc) {
            document.getElementById('locationView').classList.add('hidden');
            document.getElementById('zoneView').classList.remove('hidden');
            document.getElementById('zoneModalSubTitle').innerText = `📍 สถานที่: ${loc.location_name}`;
            
            const container = document.getElementById('zoneContainer');
            container.innerHTML = '';
            const filteredZones = zonesData.filter(z => String(z.location_id) === String(loc.location_id));
            
            filteredZones.forEach(z => {
                const btn = document.createElement('button');
                btn.type = 'button';
                // บังคับความสูงปุ่มโซนให้สูงเท่ากันพอดี (h-11) ไม่ยืดขยายใหญ่เกินไป
                btn.className = 'h-11 px-2 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl text-center font-bold text-xs truncate transition cursor-pointer flex items-center justify-center gap-1';
                btn.innerHTML = `🛋️ ${z.zone_name}`;
                btn.onclick = () => {
                    if (window.parent) {
                        window.parent.postMessage({
                            type: 'SELECT_LOCATION_ZONE',
                            locationId: loc.location_id,
                            locationName: loc.location_name,
                            zoneId: z.zone_id,
                            zoneName: z.zone_name
                        }, '*');
                    }
                };
                container.appendChild(btn);
            });
        }

        function backToLocations() {
            renderLocations();
        }

        async function addNewLocation() {
            const name = document.getElementById('newLocationInput').value.trim();
            if (!name) return;
            const { data } = await supabaseClient.from('locations').insert([{ location_name: name, min_order_for_free_delivery: 300, delivery_fee: 20 }]).select().single();
            if (data) { 
                locationsData.push(data); 
                document.getElementById('newLocationInput').value = ''; 
                renderLocations(); 
            }
        }

        async function addNewZone() {
            const name = document.getElementById('newZoneInput').value.trim();
            if (!name || !tempSelectedLocation) return;
            const { data } = await supabaseClient.from('location_zone').insert([{ zone_name: name, location_id: tempSelectedLocation.location_id }]).select().single();
            if (data) { 
                zonesData.push(data); 
                document.getElementById('newZoneInput').value = ''; 
                renderZones(tempSelectedLocation); 
            }
        }
    </script>
</body>
</html>
