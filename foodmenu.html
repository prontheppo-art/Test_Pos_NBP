<!-- ไฟล์: FoodMenu.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ระบบเลือกรายการอาหาร - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { 
            -webkit-text-size-adjust: 100%; 
            margin: 0; 
            padding: 0.5rem; 
            font-family: 'Sarabun', sans-serif; 
            background: #ffffff; 
            overflow-x: hidden; 
            width: 100%;
            height: auto; 
            min-height: auto; 
            user-select: none;
            touch-action: pan-y;
            font-size: 16px !important; 
        }
        input[type="number"], input[type="text"] { font-size: 16px !important; }
        .custom-label { font-size: 16px !important; font-weight: 700; }

        /* ระบบ Modal Popup สำหรับหน้าใส่รายละเอียดอาหาร */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh; 
            padding-bottom: 2rem;
            padding-left: 1rem;
            padding-right: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
        }
        .popup-overlay.active { opacity: 1; visibility: visible; }
        .popup-box {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            height: auto; 
            max-height: 90vh; 
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.95);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .popup-overlay.active .popup-box { transform: scale(1); }
        .popup-header {
            padding: 0.75rem 1rem;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .popup-content {
            padding: 1rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* รายการอาหาร (ปรับเป็นโทนสีน้ำเงิน) */
        .food-grid { 
            display: grid; 
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important; 
            gap: 0.5rem; 
        }
        .food-btn { 
            position: relative; 
            background: #ffffff; 
            border: 1.5px solid #3b82f6; /* เปลี่ยนเป็นสีน้ำเงิน */
            color: #1d4ed8; /* เปลี่ยนเป็นตัวหนังสือสีน้ำเงินเข้ม */
            font-weight: 700; 
            font-size: 16px !important; 
            padding: 0.6rem 0.4rem; 
            border-radius: 0.75rem; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); 
            transition: all 0.15s ease; 
            cursor: pointer; 
            min-height: 50px; 
            word-break: break-word; 
            width: 100%; 
        }
        .food-btn:active { background-color: #3b82f6; color: #ffffff; transform: scale(0.97); }

        /* ป้ายแจ้งเตือนจำนวน */
        .badge-count { 
            position: absolute; 
            top: -0.35rem; 
            right: -0.35rem; 
            background-color: #ef4444; 
            color: white; 
            font-size: 13px !important; 
            font-weight: 800; 
            width: 1.5rem; 
            height: 1.5rem; 
            border-radius: 9999px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid #ffffff; 
            z-index: 10;
        }

        .back-btn {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-weight: 700;
            font-size: 16px !important; 
            padding: 0.3rem 0.6rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        .back-btn:active { background-color: #e2e8f0; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-white">

    <!-- ================= VIEW: หน้าแสดงรายการอาหารทั้งหมด / กรองตาม Group ID ================= -->
    <div id="foodView" class="w-full">
        <div id="foodGridContainer" class="food-grid">
            <div class="col-span-2 text-center py-6 text-slate-400 font-bold text-base">⏳ กำลังโหลดรายการอาหาร...</div>
        </div>
    </div>

    <!-- ================= POPUP CONTAINER สำหรับหน้าใส่รายละเอียดอาหาร (SelectItem) ================= -->
    <div id="appPopupOverlay" class="popup-overlay" onclick="handlePopupOverlayClick(event)">
        <div class="popup-box" onclick="event.stopPropagation()">
            
            <!-- Popup Header -->
            <div class="popup-header">
                <button type="button" id="popupBackBtn" class="back-btn" onclick="closeAppPopup()">◀ ปิด</button>
                <span id="popupTitleText" class="font-extrabold text-slate-800 text-base truncate px-2">รายละเอียด</span>
                <button type="button" onclick="closeAppPopup()" class="w-8 h-8 bg-slate-200 hover:bg-rose-100 text-slate-600 hover:text-rose-600 rounded-full flex items-center justify-center font-bold text-sm cursor-pointer transition">✕</button>
            </div>

            <!-- Popup Content Body -->
            <div class="popup-content">
                <!-- หน้าใส่รายละเอียดอาหาร -->
                <div id="itemDetailView" class="w-full space-y-3">
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <span id="foodTitleName" class="font-extrabold text-slate-900 text-base truncate pr-2">📌 รายการอาหาร</span>
                        <button type="button" onclick="saveToCart()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3.5 py-2 rounded-xl text-base shadow-md active:scale-95 transition cursor-pointer flex items-center gap-1 shrink-0">
                            <span>💾 บันทึก</span>
                        </button>
                    </div>

                    <!-- ตะกร้าของเมนูนี้ -->
                    <div id="selectedCartItemsBox" class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 hidden">
                        <div class="flex justify-between items-center mb-1.5">
                            <span id="cartBoxTitle" class="text-[15px] text-slate-600 font-bold">🛒 รายการที่เลือกไว้แล้ว:</span>
                            <span id="selectedCartCountBadge" class="bg-blue-600 text-white font-extrabold text-[13px] px-2.5 py-0.5 rounded-full">0 รายการ</span>
                        </div>
                        <div id="selectedCartList" class="space-y-1.5 text-[16px] text-slate-700 max-h-28 overflow-y-auto pr-0.5"></div>
                    </div>

                    <!-- ราคา และ จำนวน -->
                    <div class="grid grid-cols-2 gap-2.5 items-center">
                        <div>
                            <label class="block custom-label text-slate-700 mb-1">ราคาพิเศษ (ถ้ามี)</label>
                            <input type="number" id="foodPrice" placeholder="ระบุราคา" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800 text-center text-base">
                        </div>
                        <div>
                            <label class="block custom-label text-slate-700 mb-1">จำนวน</label>
                            <div class="flex items-center justify-between bg-slate-50 border border-slate-300 rounded-xl px-2 py-1.5">
                                <button type="button" onclick="adjustQty(-1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold flex items-center justify-center text-base">-</button>
                                <span id="foodQty" class="font-extrabold text-base text-slate-800">1</span>
                                <button type="button" onclick="adjustQty(1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold flex items-center justify-center text-base">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- ไข่ดาว / ไข่เจียว (แสดงเฉพาะกลุ่มที่กำหนด เช่น 1 หรือ 2) -->
                    <div id="eggSection" class="grid grid-cols-2 gap-2 items-center hidden">
                        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl flex items-center justify-between">
                            <span class="custom-label text-slate-700">ไข่ดาว</span>
                            <div class="flex items-center gap-1.5">
                                <button type="button" onclick="adjustExtra('friedEgg', -1)" class="w-6 h-6 bg-white border rounded-lg font-bold text-base">-</button>
                                <span id="friedEggQty" class="font-bold text-base w-5 text-center">0</span>
                                <button type="button" onclick="adjustExtra('friedEgg', 1)" class="w-6 h-6 bg-white border rounded-lg font-bold text-base">+</button>
                            </div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl flex items-center justify-between">
                            <span class="custom-label text-slate-700">ไข่เจียว</span>
                            <div class="flex items-center gap-1.5">
                                <button type="button" onclick="adjustExtra('omelet', -1)" class="w-6 h-6 bg-white border rounded-lg font-bold text-base">-</button>
                                <span id="omeletQty" class="font-bold text-base w-5 text-center">0</span>
                                <button type="button" onclick="adjustExtra('omelet', 1)" class="w-6 h-6 bg-white border rounded-lg font-bold text-base">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- หมายเหตุ -->
                    <div>
                        <label class="block custom-label text-slate-700 mb-1">หมายเหตุ</label>
                        <input type="text" id="foodNote" placeholder="(เช่น เผ็ดน้อย, ไม่ใส่ผัก)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 text-base">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="supabaseClient.js"></script>
    <script>
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

        let db;
        let cachedFoods = [];
        
        let targetGroupFilter = null; // ตัวแปรสำหรับกรอง Group ID (เช่น ส่งค่าทาง URL param หรือฟังก์ชันภายนอก)
        let selectedFoodId = null;
        let selectedFoodName = '';
        let selectedFoodGroupId = null;
        let currentQty = 1;
        let friedEgg = 0;
        let omelet = 0;
        const EGG_CATEGORY_IDS = ['1', '2'];

        // ตรวจสอบค่า Parameter จาก URL เช่น ?group=1 เพื่อดึงเฉพาะ Group ID นั้นๆ
        function checkUrlGroupFilter() {
            const urlParams = new URLSearchParams(window.location.search);
            const groupParam = urlParams.get('group') || urlParams.get('food_group_id');
            if (groupParam) {
                targetGroupFilter = Number(groupParam);
            }
        }

        function sendAutoHeight() {
            setTimeout(() => {
                const actualHeight = document.body.scrollHeight || document.documentElement.scrollHeight;
                window.parent.postMessage({
                    type: 'RESIZE_IFRAME',
                    action: 'resizeIframe',
                    iframeId: window.name || 'iframeFoodMenu',
                    height: actualHeight + 20
                }, '*');
            }, 50);
        }

        function initDB() {
            if (typeof supabaseClient !== 'undefined') {
                db = supabaseClient;
            } else if (typeof window.supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined') {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        }

        function openAppPopup() {
            const overlay = document.getElementById('appPopupOverlay');
            overlay.classList.add('active');
            initItemDetail();
            sendAutoHeight();
        }

        function closeAppPopup() {
            const overlay = document.getElementById('appPopupOverlay');
            overlay.classList.remove('active');
            renderFoodGrid();
        }

        function handlePopupOverlayClick(event) {
            if (event.target.id === 'appPopupOverlay') {
                closeAppPopup();
            }
        }

        function renderFoodGrid() {
            const container = document.getElementById('foodGridContainer');
            container.innerHTML = '';

            // ถ้ามี targetGroupFilter ให้กรองเฉพาะกลุ่มนั้น ถ้าไม่มี (Default) จะแสดงทั้งหมด
            let foodsToDisplay = cachedFoods;
            if (targetGroupFilter !== null && !isNaN(targetGroupFilter)) {
                foodsToDisplay = cachedFoods.filter(f => Number(f.food_group_id) === Number(targetGroupFilter));
            }

            if (!foodsToDisplay || foodsToDisplay.length === 0) {
                container.innerHTML = '<div class="col-span-2 text-center py-6 text-slate-400 font-bold text-base">ไม่มีรายการอาหารในเงื่อนไขนี้</div>';
                sendAutoHeight();
                return;
            }

            foodsToDisplay.sort((a, b) => {
                const nameA = (a.food_name || '').toString().trim();
                const nameB = (b.food_name || '').toString().trim();
                return nameA.localeCompare(nameB, ['th', 'en'], { numeric: true, sensitivity: 'base' });
            });

            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            foodsToDisplay.forEach(food => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'food-btn';
                
                const foodId = food.food_id;
                const foodName = food.food_name || '';

                const qtyInCart = cart.filter(item => Number(item.food_id) === Number(foodId))
                                      .reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
                                      
                const badgeHTML = qtyInCart > 0 ? `<span class="badge-count">${qtyInCart}</span>` : '';
                btn.innerHTML = `<span>${foodName}</span>${badgeHTML}`;
                
                btn.onclick = () => {
                    selectedFoodId = foodId;
                    selectedFoodName = foodName;
                    selectedFoodGroupId = food.food_group_id;
                    openAppPopup();
                };

                container.appendChild(btn);
            });
            sendAutoHeight();
        }

        function initItemDetail() {
            currentQty = 1;
            friedEgg = 0;
            omelet = 0;
            document.getElementById('foodPrice').value = '';
            document.getElementById('foodNote').value = '';
            document.getElementById('foodQty').textContent = currentQty;
            document.getElementById('friedEggQty').textContent = friedEgg;
            document.getElementById('omeletQty').textContent = omelet;
            document.getElementById('foodTitleName').textContent = selectedFoodName ? `📌 ${selectedFoodName}` : `📌 -`;

            checkAndToggleEggSection();
            renderSelectedCartList();
        }

        function checkAndToggleEggSection() {
            const eggSection = document.getElementById('eggSection');
            if (selectedFoodGroupId && EGG_CATEGORY_IDS.includes(String(selectedFoodGroupId))) {
                eggSection.classList.remove('hidden');
            } else {
                eggSection.classList.add('hidden');
                friedEgg = 0;
                omelet = 0;
            }
            sendAutoHeight();
        }

        function adjustQty(val) {
            currentQty = Math.max(1, currentQty + val);
            document.getElementById('foodQty').textContent = currentQty;
        }

        function adjustExtra(type, val) {
            if (type === 'friedEgg') {
                friedEgg = Math.max(0, friedEgg + val);
                document.getElementById('friedEggQty').textContent = friedEgg;
            } else if (type === 'omelet') {
                omelet = Math.max(0, omelet + val);
                document.getElementById('omeletQty').textContent = omelet;
            }
        }

        function groupCartItems(items) {
            const map = new Map();
            items.forEach(item => {
                const basePriceKey = (item.base_price !== null && item.base_price !== undefined) ? String(item.base_price) : 'null';
                const fEggKey = Number(item.friedEggQty || 0);
                const oMelKey = Number(item.omeletQty || 0);
                const noteKey = String(item.note || '').trim();
                const nameKey = String(item.name || '').trim();
                const signature = `${nameKey}_${basePriceKey}_${fEggKey}_${oMelKey}_${noteKey}`;

                if (map.has(signature)) {
                    let existing = map.get(signature);
                    existing.qty += Number(item.qty || 0);
                    if (existing.price !== null && existing.price !== undefined) {
                        existing.totalPrice = existing.price * existing.qty;
                    }
                } else {
                    map.set(signature, { ...item });
                }
            });
            return Array.from(map.values());
        }

        function renderSelectedCartList() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const boxContainer = document.getElementById('selectedCartItemsBox');
            const listContainer = document.getElementById('selectedCartList');
            const badge = document.getElementById('selectedCartCountBadge');
            
            listContainer.innerHTML = '';
            
            const rawFilteredItems = cart.filter(item => 
                (selectedFoodId && String(item.food_id) === String(selectedFoodId)) || 
                (selectedFoodName && String(item.name).trim() === String(selectedFoodName).trim())
            );

            if (rawFilteredItems.length === 0) {
                boxContainer.classList.add('hidden');
                sendAutoHeight();
                return;
            }

            const currentFoodCartItems = groupCartItems(rawFilteredItems);
            boxContainer.classList.remove('hidden');
            
            const totalQty = currentFoodCartItems.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
            badge.textContent = `${currentFoodCartItems.length} รายการ (${totalQty} ชิ้น)`;

            currentFoodCartItems.forEach(item => {
                let eggText = '';
                if (item.friedEggQty > 0) eggText += ` +ไข่ดาว ${item.friedEggQty}`;
                if (item.omeletQty > 0) eggText += ` +ไข่เจียว ${item.omeletQty}`;

                const displayPrice = (item.price !== null && item.price !== undefined) ? item.price : item.base_price;

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-white p-1.5 rounded-lg border border-slate-200';
                div.innerHTML = `
                    <div class="font-bold text-slate-700 truncate pr-1">
                        <span class="text-blue-600">${item.qty}x</span> ${item.name} ${displayPrice !== null && displayPrice !== undefined ? `<span class="text-amber-600">(${displayPrice}฿)</span>` : ''}${eggText}
                        ${item.note ? `<br><span class="text-slate-400 font-normal text-[13px]">(${item.note})</span>` : ''}
                    </div>
                    <button type="button" onclick="deleteCartItemMatch('${item.name}', ${item.base_price}, ${item.friedEggQty || 0}, ${item.omeletQty || 0}, '${item.note || ''}')" class="text-rose-500 font-bold px-2 py-1 text-sm cursor-pointer">✕</button>
                `;
                listContainer.appendChild(div);
            });
            sendAutoHeight();
        }

        function deleteCartItemMatch(name, basePrice, fEgg, oMel, note) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => {
                const sameName = String(item.name || '').trim() === String(name).trim();
                const itemBasePrice = (item.base_price !== null && item.base_price !== undefined) ? Number(item.base_price) : null;
                const targetBasePrice = (basePrice !== null && basePrice !== undefined && !isNaN(basePrice)) ? Number(basePrice) : null;
                const samePrice = itemBasePrice === targetBasePrice;
                const sameFEgg = Number(item.friedEggQty || 0) === Number(fEgg);
                const sameOMel = Number(item.omeletQty || 0) === Number(oMel);
                const sameNote = String(item.note || '').trim() === String(note).trim();
                return !(sameName && samePrice && sameFEgg && sameOMel && sameNote);
            });

            localStorage.setItem('cart', JSON.stringify(cart));
            renderSelectedCartList();
            if (window.parent) {
                window.parent.postMessage({ type: 'UPDATE_CART', action: 'updateCart', cart: cart }, '*');
            }
        }

        function saveToCart() {
            const priceInput = document.getElementById('foodPrice').value;
            const price = priceInput !== "" ? parseFloat(priceInput) : null;
            const note = document.getElementById('foodNote').value.trim();
            
            const finalPrice = (price !== null && !isNaN(price)) ? price : null;

            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            const existingIndex = cart.findIndex(item => {
                const sameFood = (selectedFoodId && String(item.food_id) === String(selectedFoodId)) || 
                                 (selectedFoodName && String(item.name).trim() === String(selectedFoodName).trim());
                const itemBasePriceStr = (item.base_price !== null && item.base_price !== undefined) ? String(item.base_price) : 'null';
                const currentBasePriceStr = price !== null ? String(price) : 'null';
                return sameFood && (itemBasePriceStr === currentBasePriceStr) && 
                       Number(item.friedEggQty || 0) === Number(friedEgg) && 
                       Number(item.omeletQty || 0) === Number(omelet) && 
                       String(item.note || '').trim() === note;
            });

            if (existingIndex !== -1) {
                cart[existingIndex].qty = Number(cart[existingIndex].qty || 0) + Number(currentQty);
                if (cart[existingIndex].price !== null && cart[existingIndex].price !== undefined) {
                    cart[existingIndex].totalPrice = cart[existingIndex].price * cart[existingIndex].qty;
                }
            } else {
                cart.push({
                    item_id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                    food_id: selectedFoodId,
                    name: selectedFoodName,
                    price: finalPrice, 
                    base_price: price, 
                    friedEggQty: friedEgg,
                    omeletQty: omelet,
                    qty: currentQty,
                    note: note,
                    totalPrice: finalPrice !== null ? finalPrice * currentQty : null,
                    food_group_id: selectedFoodGroupId,
                    is_custom: price !== null
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));

            if (window.parent) {
                window.parent.postMessage({ type: 'UPDATE_CART', action: 'updateCart', cart: cart }, '*');
            }

            closeAppPopup();
        }

        async function loadData() {
            checkUrlGroupFilter();

            const cachedF = localStorage.getItem('cache_foods');
            if (cachedF) {
                try {
                    cachedFoods = JSON.parse(cachedF);
                    renderFoodGrid();
                } catch(e) { console.error('Cache error', e); }
            }

            initDB();
            if (!db) return;

            try {
                const foodRes = await db.from('foods').select('*').order('food_id', { ascending: true });

                if (foodRes.data) {
                    cachedFoods = foodRes.data;
                    localStorage.setItem('cache_foods', JSON.stringify(cachedFoods));
                    renderFoodGrid();
                }
            } catch (err) { 
                console.error('Load Data Error:', err); 
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'cart' || !e.key) {
                renderFoodGrid();
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data && (event.data.type === 'UPDATE_CART' || event.data.action === 'updateCart')) {
                if (event.data.cart) localStorage.setItem('cart', JSON.stringify(event.data.cart));
                renderFoodGrid();
            }
        });

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
