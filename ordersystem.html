<!-- ไฟล์: ordersystem.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ระบบรับออเดอร์ - ลาบหนองบัวลำภู</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="supabaseClient.js"></script>
    
    <style>
        :root { --bg-color: #f8fafc; }
        html, body { 
            width: 100%; min-height: 100%; 
            touch-action: pan-y; -webkit-text-size-adjust: 100%;
            background-color: var(--bg-color); color: #1e293b;
            font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; user-select: none; 
        }
        
        .custom-modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(15, 23, 42, 0.65); 
            display: none; align-items: center; justify-content: center; 
            z-index: 9999; padding: 16px; 
        }
        .custom-modal-overlay.active { display: flex !important; }
        
        .popup-container {
            background: #ffffff; 
            width: 100% !important; 
            max-width: 28rem !important; 
            height: 60vh !important; 
            border-radius: 1.5rem !important; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .popup-container.special-menu-popup {
            max-width: 100% !important; height: 100vh !important; max-height: 100vh !important;
            border-radius: 0 !important;
        }

        .popup-content-wrapper { width: 100%; height: 100%; background: #ffffff; flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .group-btn-v2 { background-color: #ffffff; border: 1.5px solid #fde68a; color: #334155; transition: all 0.2s ease; }
        .group-btn-v2.active { background-color: #f59e0b; border-color: #d97706; color: #ffffff; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3); }
        .customer-autocomplete-wrapper { position: relative; width: 100%; }
        .customer-dropdown {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #ffffff;
            border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-height: 180px; overflow-y: auto; z-index: 50; display: none;
        }
        .customer-dropdown.active { display: block; }
        .customer-dropdown-item {
            padding: 10px 12px; font-size: 12px; color: #334155; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9;
        }
        .customer-dropdown-item:hover { background-color: #fef3c7; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
        .delete-btn { color: #ef4444; font-weight: bold; font-size: 18px; padding: 0 6px; cursor: pointer; background: transparent; border: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- แถบเมนูด้านบน (ปรับแท็บที่ 3 ให้เรียก goToPrintOrder() ทันที) -->
    <div class="p-3 pb-2 z-35 flex-shrink-0 bg-white border-b border-slate-200 no-print sticky top-0">
        <div class="max-w-xl mx-auto grid grid-cols-3 gap-1.5">
            <button type="button" onclick="switchTab(1)" id="tabBtn1" class="py-2 px-1 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow bg-amber-500 text-white cursor-pointer transition">
                <span>🛒</span> <span>1.เลือก</span>
            </button>
            <button type="button" onclick="switchTab(2)" id="tabBtn2" class="py-2 px-1 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow bg-slate-100 text-slate-600 cursor-pointer transition">
                <span>🔍</span> <span>2.ตรวจ</span>
            </button>
            <button type="button" onclick="goToPrintOrder()" id="tabBtn3" class="py-2 px-1 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow bg-slate-100 text-slate-600 cursor-pointer transition">
                <span>🖨️</span> <span>3.พิมพ์</span>
            </button>
        </div>
    </div>

    <!-- พื้นที่แสดงเนื้อหาของแต่ละแท็บ -->
    <div class="flex-1 w-full max-w-xl mx-auto p-3 flex flex-col relative">
        
        <!-- TAB 1: เลือกรายการอาหาร -->
        <div id="tabContent1" class="flex flex-col w-full">
            <div class="pb-1 flex-shrink-0">
                <div class="bg-white p-2.5 px-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                    <span class="font-bold text-sm text-slate-700">🛒 ตะกร้าสินค้าปัจจุบัน:</span>
                    <span class="text-emerald-600 font-extrabold text-base" id="cartCountTextTab1">0 รายการ | 0 ชิ้น</span>
                </div>
            </div>
            <!-- แทนที่ส่วนที่วงด้วย iframe เรียกไฟล์ foodgroup.html -->
            <div class="w-full my-2" style="height: 70vh; min-height: 480px;">
                <iframe id="foodGroupFrame" src="foodgroup.html" class="w-full h-full border-0 rounded-2xl bg-white shadow-sm"></iframe>
            </div>
            <div class="pt-2 pb-4 flex gap-2 flex-shrink-0">
                <button type="button" onclick="window.location.href='index.html'" class="bg-white text-slate-700 border border-slate-300 font-bold py-2.5 px-2 rounded-2xl text-xs flex-1 shadow active:scale-95 transition cursor-pointer">🏠 หน้าหลัก</button>
                <button type="button" onclick="confirmClearCart()" class="bg-rose-50 text-rose-600 border border-rose-200 font-bold py-2.5 px-2 rounded-2xl text-xs flex-1 shadow active:scale-95 transition cursor-pointer">🗑️ ล้างตะกร้า</button>
                <button type="button" onclick="switchTab(2)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-2 rounded-2xl text-xs flex-1 shadow active:scale-95 transition cursor-pointer">🔍 ไปตรวจสอบ</button>
            </div>
        </div>

        <!-- TAB 2: ตรวจสอบและระบุลูกค้า -->
        <div id="tabContent2" class="flex flex-col w-full hidden">
            <div id="locationSelectorWrapper" class="flex-shrink-0 mb-2"></div>
            <div class="flex-1 flex flex-col min-h-0 gap-2 mb-4">
                <div class="flex justify-between items-center px-1 text-xs font-bold text-slate-700 shrink-0">
                    <span class="flex items-center gap-1.5">🛒 ตะกร้าสินค้า:</span>
                    <span id="cartCountTextTab2" class="text-green-600 font-extrabold text-sm">0 รายการ | 0 ชิ้น</span>
                </div>
                <div class="cart-preview-box bg-white border-2 dashed border-green-300 rounded-2xl p-3 shadow-sm flex-1 flex flex-col min-h-0" style="max-height: 50vh;">
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-dashed border-green-200 flex-shrink-0">
                        <span class="font-bold text-green-700 text-sm">📋 รายการที่เลือกไว้แล้ว</span>
                        <div id="cartTotalPrice" class="font-black text-red-600 text-base">รวม 0.-</div>
                    </div>
                    <div class="flex-1 overflow-y-auto pr-1">
                        <div id="cartPreviewList" class="flex flex-col">
                            <span class="text-gray-400 text-xs py-4 text-center block">⏳ กำลังโหลดรายการ...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pt-2 pb-4 flex gap-2 flex-shrink-0">
                <button type="button" onclick="switchTab(1)" class="bg-white text-slate-700 border border-slate-300 font-bold py-3 px-3 rounded-xl text-xs flex-1 shadow-sm transition flex items-center justify-center gap-1 cursor-pointer">⬅️ กลับไปเลือกเพิ่ม</button>
                <button type="button" onclick="goToPrintOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-3 rounded-xl text-xs flex-1 shadow transition flex items-center justify-center gap-1 cursor-pointer">✅ ไปหน้าสรุป/พิมพ์</button>
            </div>
        </div>

    </div>

    <!-- Modal Pop-up (คลิกด้านนอกเพื่อปิด) -->
    <div id="dynamicPopupOverlay" class="custom-modal-overlay" onclick="closeDynamicPopup()">
        <div id="popupContainerBox" class="popup-container" onclick="event.stopPropagation()">
            <div class="popup-content-wrapper">
                <iframe id="popupIframe" src="" class="w-full h-full border-0 block flex-1"></iframe>
            </div>
        </div>
    </div>

    <!-- Modal ยืนยันการล้างตะกร้า -->
    <div id="confirmClearModalOverlay" class="custom-modal-overlay" onclick="closeConfirmClearModal()">
        <div class="bg-white rounded-3xl max-w-xs w-full p-5 text-center border border-slate-200 shadow-2xl m-4" onclick="event.stopPropagation()">
            <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">🗑️</div>
            <h3 class="text-base font-extrabold text-slate-800 mb-1">ยืนยันการล้างตะกร้า?</h3>
            <p class="text-xs text-slate-500 mb-5">รายการอาหารทั้งหมดในตะกร้าจะถูกยกเลิก</p>
            <div class="flex gap-2">
                <button type="button" onclick="closeConfirmClearModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl cursor-pointer">ยกเลิก</button>
                <button type="button" onclick="executeClearAllCart()" class="flex-1 py-2.5 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-sm cursor-pointer">ยืนยันการลบ</button>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let dbFoodsMap = {};
        let customersList = [];
        let selectedCustomerObj = null;
        let locationFoodPricesMap = {};
        let isDeliveryFeeWaived = false;

        let locationData = {
            groupId: 1, groupName: 'ชาวบ้าน', phone: '', locationName: '', zoneName: '', locationId: null, zoneId: null
        };
        let currentOrderSummary = { itemsCount: 0, totalQty: 0, subtotal: 0, deliveryFee: 0, grandTotal: 0, processedCart: [] };
        let processedItemsForDb = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([
                fetchLatestFoods(),
                fetchCustomersData(),
                fetchLocationFoodPrices()
            ]);

            initLocationComponent('locationSelectorWrapper');
            updateCartUI();

            const urlParams = new URLSearchParams(window.location.search);
            const targetTab = urlParams.get('tab');
            if (targetTab && !isNaN(targetTab)) {
                switchTab(parseInt(targetTab, 10));
            }
        });

        function switchTab(tabIndex) {
            closeDynamicPopup();

            for (let i = 1; i <= 2; i++) {
                const contentEl = document.getElementById(`tabContent${i}`);
                const btnEl = document.getElementById(`tabBtn${i}`);
                if (contentEl) contentEl.classList.add('hidden');
                if (btnEl) btnEl.className = "py-2 px-1 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow bg-slate-100 text-slate-600 cursor-pointer transition";
            }
            
            const activeContent = document.getElementById(`tabContent${tabIndex}`);
            const activeBtn = document.getElementById(`tabBtn${tabIndex}`);
            if (activeContent) activeContent.classList.remove('hidden');
            
            const activeColors = ['bg-amber-500 text-white', 'bg-emerald-600 text-white'];
            if (activeBtn) activeBtn.className = `py-2 px-1 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow ${activeColors[tabIndex - 1]} cursor-pointer transition`;

            if (tabIndex === 2) {
                renderOrderSummary();
            }
        }

        function updateCartUI() {
            cart = JSON.parse(localStorage.getItem('cart')) || [];
            const totalItems = cart.length;
            const totalQty = cart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
            
            if(document.getElementById('cartCountTextTab1')) document.getElementById('cartCountTextTab1').textContent = `${totalItems} รายการ - ${totalQty} ชิ้น`;
            if(document.getElementById('cartCountTextTab2')) document.getElementById('cartCountTextTab2').textContent = `${totalItems} รายการ - ${totalQty} ชิ้น`;

            const foodGroupFrame = document.getElementById('foodGroupFrame');
            if (foodGroupFrame && foodGroupFrame.contentWindow) {
                try {
                    foodGroupFrame.contentWindow.postMessage({ type: 'UPDATE_CART', cart: cart }, '*');
                } catch(e) {}
            }
        }

        function confirmClearCart() { document.getElementById('confirmClearModalOverlay').classList.add('active'); }
        function closeConfirmClearModal() { document.getElementById('confirmClearModalOverlay').classList.remove('active'); }
        function executeClearAllCart() {
            cart = [];
            localStorage.removeItem('cart');
            closeConfirmClearModal();
            updateCartUI();
        }

        function openDynamicPopup(url, isSpecialMenu = false) {
            const containerBox = document.getElementById('popupContainerBox');
            const iframeEl = document.getElementById('popupIframe');
            
            if (isSpecialMenu) {
                containerBox.classList.add('special-menu-popup');
            } else {
                containerBox.classList.remove('special-menu-popup');
            }

            iframeEl.src = url;
            document.getElementById('dynamicPopupOverlay').classList.add('active');
        }

        function closeDynamicPopup() {
            document.getElementById('dynamicPopupOverlay').classList.remove('active');
            document.getElementById('popupIframe').src = '';
            updateCartUI();
        }

        function removeDuplicateWords(text) {
            if (!text) return '';
            const parts = text.trim().split(/\s+/);
            return (parts.length === 2 && parts[0] === parts[1]) ? parts[0] : text.trim();
        }

        function initLocationComponent(targetContainerId) {
            const container = document.getElementById(targetContainerId);
            if (!container) return;

            container.innerHTML = `
                <div class="bg-amber-50/50 border border-amber-200 rounded-2xl p-3 shadow-sm space-y-2">
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="selectCustomerGroup(1, 'ชาวบ้าน')" id="btn-group-1-${targetContainerId}" class="group-btn-v2 active h-[38px] rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer">🏡 ชาวบ้าน</button>
                        <button type="button" onclick="selectCustomerGroup(2, 'นักท่องเที่ยว')" id="btn-group-2-${targetContainerId}" class="group-btn-v2 h-[38px] rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer">🧳 นักท่องเที่ยว</button>
                        <button type="button" onclick="selectCustomerGroup(3, 'สบายดี')" id="btn-group-3-${targetContainerId}" class="group-btn-v2 h-[38px] rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer">😊 สบายดี</button>
                    </div>
                    <div class="flex gap-2 items-center">
                        <div class="flex-1 customer-autocomplete-wrapper">
                            <input type="text" id="customerInput-${targetContainerId}" oninput="handleCustomerInput(this.value)" placeholder="👤 ชื่อ หรือ เบอร์โทรลูกค้า" autocomplete="off" class="customer-input-field w-full h-[38px] px-3 border border-amber-200 rounded-xl text-xs bg-white outline-none">
                            <div id="customerDropdown-${targetContainerId}" class="customer-dropdown"></div>
                        </div>
                        <div id="locationBtnContainer-${targetContainerId}" class="w-5/12 hidden">
                            <button type="button" onclick="openLocationZoneModal()" class="w-full h-[38px] bg-amber-500 text-white font-bold px-2 rounded-xl text-xs flex items-center justify-center gap-1 shadow-sm">📍 <span id="locationBtnText-${targetContainerId}" class="truncate">เลือกสถานที่</span></button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchLocationFoodPrices() {
            if (typeof supabaseClient !== 'undefined') {
                const { data } = await supabaseClient.from('location_food_prices').select('*');
                if (data) {
                    locationFoodPricesMap = {};
                    data.forEach(item => { locationFoodPricesMap[`${item.location_id}_${item.food_id}`] = Number(item.custom_price || 0); });
                }
            }
        }

        async function fetchCustomersData() {
            if (typeof supabaseClient !== 'undefined') {
                const { data } = await supabaseClient.from('customers').select('*').order('customer_name', { ascending: true });
                if (data) customersList = data;
            }
        }

        async function fetchLatestFoods() {
            if (typeof supabaseClient !== 'undefined') {
                const { data } = await supabaseClient.from('foods').select('*');
                if (data) { 
                    dbFoodsMap = {}; 
                    data.forEach(f => { 
                        const fid = String(f.food_id || f.id);
                        dbFoodsMap[fid] = f; 
                    }); 
                }
            }
        }

        function handleCustomerInput(val) {
            document.querySelectorAll('.customer-input-field').forEach(inp => {
                if (inp.value !== val) inp.value = val;
            });
            selectedCustomerObj = null;

            const dropdown = document.getElementById('customerDropdown-locationSelectorWrapper');
            if (!dropdown) return;
            const cleanVal = removeDuplicateWords(val);
            if (!cleanVal) { dropdown.classList.remove('active'); return; }
            const matches = customersList.filter(c => removeDuplicateWords(c.customer_name || '').toLowerCase().includes(cleanVal.toLowerCase()));
            if (matches.length === 0) { dropdown.classList.remove('active'); return; }
            dropdown.innerHTML = '';
            matches.forEach(cust => {
                const item = document.createElement('div');
                item.className = 'customer-dropdown-item';
                item.innerHTML = `<span class="font-semibold">${removeDuplicateWords(cust.customer_name)}</span>`;
                item.onclick = () => {
                    selectedCustomerObj = cust;
                    document.querySelectorAll('.customer-input-field').forEach(inp => inp.value = removeDuplicateWords(cust.customer_name));
                    dropdown.classList.remove('active');
                };
                dropdown.appendChild(item);
            });
            dropdown.classList.add('active');
        }

        function selectCustomerGroup(groupId, groupName) {
            locationData.groupId = groupId;
            locationData.groupName = groupName;
            isDeliveryFeeWaived = false;
            
            const btn1 = document.getElementById(`btn-group-1-locationSelectorWrapper`);
            const btn2 = document.getElementById(`btn-group-2-locationSelectorWrapper`);
            const btn3 = document.getElementById(`btn-group-3-locationSelectorWrapper`);
            
            if(btn1) btn1.classList.toggle('active', groupId === 1);
            if(btn2) btn2.classList.toggle('active', groupId === 2);
            if(btn3) btn3.classList.toggle('active', groupId === 3);

            const locContainer = document.getElementById(`locationBtnContainer-locationSelectorWrapper`);
            if (locContainer) {
                if (groupId === 2) locContainer.classList.remove('hidden');
                else locContainer.classList.add('hidden');
            }

            if (groupId !== 2) {
                locationData.locationId = null;
                locationData.zoneId = null;
                locationData.locationName = '';
                locationData.zoneName = '';
            }
            renderOrderSummary();
        }

        function openLocationZoneModal() {
            openDynamicPopup('location_zone.html', false);
        }

        function getGroupBasePrice(item, groupId) {
            const foodId = String(item.food_id || item.id || '');
            const currentLocId = locationData.locationId;

            if (currentLocId && foodId) {
                const customPriceKey = `${currentLocId}_${foodId}`;
                if (locationFoodPricesMap[customPriceKey] !== undefined && locationFoodPricesMap[customPriceKey] > 0) {
                    return Number(locationFoodPricesMap[customPriceKey]);
                }
            }

            const hasCustomPrice = item.isCustomPrice || item.is_custom_price || item.is_custom || item.isCustom || (item.custom_price !== undefined && item.custom_price !== null && item.custom_price !== '');
            if (hasCustomPrice) {
                const customVal = Number(item.custom_price !== undefined && item.custom_price !== '' ? item.custom_price : item.price);
                if (customVal > 0) return customVal;
            }

            const gId = Number(groupId) || 1;
            const foodObj = dbFoodsMap[foodId];

            if (foodObj) {
                const pLocal = Number(foodObj.price_1 || 0);
                const pTourist = Number(foodObj.price_2 || 0);
                const pSabaidee = Number(foodObj.price_3 || 0);

                if (gId === 1) return pLocal > 0 ? pLocal : (pTourist > 0 ? pTourist : Number(item.price || 0));
                if (gId === 2) return pTourist > 0 ? pTourist : (pLocal > 0 ? pLocal : Number(item.price || 0));
                if (gId === 3) return pSabaidee > 0 ? pSabaidee : (pLocal > 0 ? pLocal : Number(item.price || 0));
            }

            return Number(item.price || item.unit_price || 0);
        }

        function removeDeliveryFee() {
            isDeliveryFeeWaived = true;
            renderOrderSummary();
        }

        function renderOrderSummary() {
            cart = JSON.parse(localStorage.getItem('cart')) || [];
            const listContainer = document.getElementById('cartPreviewList');
            if (!listContainer) return;

            if (cart.length === 0) {
                listContainer.innerHTML = '<span class="text-gray-400 text-xs py-8 text-center block">ไม่มีรายการอาหารในตะกร้า</span>';
                document.getElementById('cartTotalPrice').textContent = 'รวม 0.-';
                currentOrderSummary = { itemsCount: 0, totalQty: 0, subtotal: 0, deliveryFee: 0, grandTotal: 0, processedCart: [] };
                return;
            }

            let totalCartPrice = 0;
            listContainer.innerHTML = '';
            processedItemsForDb = cart.map((item, index) => {
                const basePrice = getGroupBasePrice(item, locationData.groupId);
                const daoQty = Number(item.friedEggQty || item.khaiDaoQty || 0);
                const jiaoQty = Number(item.omeletQty || item.khaiJiaoQty || 0);
                const unitPrice = basePrice + (daoQty * 10) + (jiaoQty * 10);
                const itemQty = Number(item.qty) || 1;
                const itemTotalPrice = unitPrice * itemQty;
                totalCartPrice += itemTotalPrice;

                let details = [];
                const hasCustomPrice = item.isCustomPrice || item.is_custom_price || item.is_custom || item.isCustom || item.custom_price !== undefined;
                if (hasCustomPrice && basePrice > 0) details.push(`⭐ ราคาพิเศษ ${basePrice}.-`);
                if (daoQty > 0) details.push(`ไข่ดาว ${daoQty}`);
                if (jiaoQty > 0) details.push(`ไข่เจียว ${jiaoQty}`);
                if (item.note) details.push(item.note);

                const row = document.createElement('div');
                row.className = 'cart-item-row text-xs';
                row.innerHTML = `
                    <div class="flex-1 pr-2">
                        <span class="font-bold">${item.name}</span> <span class="text-amber-600">${details.length ? '('+details.join(', ')+')' : ''}</span>
                        <div class="text-[11px] text-slate-500">${unitPrice} x${itemQty}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-extrabold">${itemTotalPrice}.-</span>
                        <button type="button" onclick="removeCartItem(${index})" class="delete-btn">&times;</button>
                    </div>
                `;
                listContainer.appendChild(row);
                return { ...item, qty: itemQty, price: basePrice, unit_price: unitPrice, total_price: itemTotalPrice };
            });

            let deliveryFee = 0;
            const isStoreFront = locationData.locationName.includes('หน้าร้าน');
            const isTouristWithoutLocation = (locationData.groupId === 2 && !locationData.locationId);

            if (!isTouristWithoutLocation && locationData.groupId === 2 && !isStoreFront && !isDeliveryFeeWaived) {
                deliveryFee = 20;
            }

            if (deliveryFee > 0) {
                const deliveryRow = document.createElement('div');
                deliveryRow.className = 'cart-item-row bg-amber-50/60 p-2 rounded-xl my-1 border border-amber-100 text-xs';
                deliveryRow.innerHTML = `
                    <div class="flex-1 pr-2 flex items-center gap-1">
                        <span>🛵</span>
                        <div><div class="font-bold text-amber-900">ค่าบริการจัดส่ง</div></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-extrabold text-amber-900">${deliveryFee}.-</span>
                        <button type="button" onclick="removeDeliveryFee()" class="delete-btn" title="ยกเลิกค่าจัดส่ง">&times;</button>
                    </div>
                `;
                listContainer.appendChild(deliveryRow);
            }

            const grandTotal = totalCartPrice + deliveryFee;
            document.getElementById('cartTotalPrice').textContent = `รวม ${grandTotal}.-`;
            currentOrderSummary = {
                itemsCount: cart.length,
                totalQty: processedItemsForDb.reduce((s, i) => s + i.qty, 0),
                subtotal: totalCartPrice,
                deliveryFee: deliveryFee,
                grandTotal: grandTotal,
                processedCart: processedItemsForDb
            };
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            renderOrderSummary();
        }

        async function ensureCustomerSaved(inputValue) {
            const val = removeDuplicateWords(inputValue);
            if (!val) return null;
            if (selectedCustomerObj) return selectedCustomerObj;

            const existing = customersList.find(c => removeDuplicateWords(c.customer_name || '').toLowerCase() === val.toLowerCase());
            if (existing) return existing;

            try {
                if (typeof supabaseClient !== 'undefined') {
                    const { data, error } = await supabaseClient.from('customers').insert([{ customer_name: val }]).select().single();
                    if (!error && data) {
                        customersList.push(data);
                        return data;
                    }
                }
            } catch (err) { console.error('Insert Customer Error:', err); }
            return { customer_name: val };
        }

        async function goToPrintOrder() {
            cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการอาหารก่อน', 'warning');
                return;
            }

            if (!currentOrderSummary.processedCart || currentOrderSummary.processedCart.length === 0) {
                let totalCartPrice = 0;
                let processed = cart.map((item) => {
                    const basePrice = getGroupBasePrice(item, locationData.groupId);
                    const daoQty = Number(item.friedEggQty || item.khaiDaoQty || 0);
                    const jiaoQty = Number(item.omeletQty || item.khaiJiaoQty || 0);
                    const unitPrice = basePrice + (daoQty * 10) + (jiaoQty * 10);
                    const itemQty = Number(item.qty) || 1;
                    const itemTotalPrice = unitPrice * itemQty;
                    totalCartPrice += itemTotalPrice;
                    return { ...item, qty: itemQty, price: basePrice, unit_price: unitPrice, total_price: itemTotalPrice };
                });
                
                let deliveryFee = 0;
                const isStoreFront = locationData.locationName.includes('หน้าร้าน');
                if (locationData.groupId === 2 && !isStoreFront && locationData.locationId) {
                    deliveryFee = 20;
                }

                currentOrderSummary = {
                    itemsCount: cart.length,
                    totalQty: processed.reduce((s, i) => s + i.qty, 0),
                    subtotal: totalCartPrice,
                    deliveryFee: deliveryFee,
                    grandTotal: totalCartPrice + deliveryFee,
                    processedCart: processed
                };
            }

            const rawCustomerInput = document.querySelector('.customer-input-field')?.value || '';
            const customerObj = await ensureCustomerSaved(rawCustomerInput);
            const customerDisplayName = customerObj ? removeDuplicateWords(customerObj.customer_name || '') : removeDuplicateWords(rawCustomerInput);

            let finalNickname = customerDisplayName;
            if (!finalNickname) {
                finalNickname = locationData.locationName || 'ลูกค้าทั่วไป';
                if (locationData.zoneName && locationData.zoneName !== locationData.locationName) {
                    finalNickname += ` (${locationData.zoneName})`;
                }
            }

            const orderPayload = {
                locationData: locationData,
                customerDisplayName: finalNickname,
                customerId: customerObj ? String(customerObj.customer_id || '') : null,
                orderSummary: currentOrderSummary
            };

            sessionStorage.setItem('printOrderData', JSON.stringify(orderPayload));
            window.location.href = 'printorder.html';
        }

        window.addEventListener('message', (event) => {
            if (!event.data) return;
            const data = event.data;

            if (data.cart) {
                localStorage.setItem('cart', JSON.stringify(data.cart));
                updateCartUI();
            }
            if (data.type === 'OPEN_SELECT_FOOD') {
                openDynamicPopup(`foodselect.html?mode=food_list&cat_id=${data.catId}`, false);
            }
            else if (data.type === 'OPEN_SPECIAL_MENU') {
                openDynamicPopup(`foodselect.html?mode=special_menu`, true);
            }
            else if (data.type === 'OPEN_SELECT_ITEM') {
                openDynamicPopup(`foodselect.html?mode=select_item&food_id=${data.food_id}&name=${encodeURIComponent(data.name)}`, false);
            }
            else if (data.type === 'CLOSE_MODAL') {
                closeDynamicPopup();
            }
            else if (data.type === 'SELECT_LOCATION_ZONE') {
                locationData.locationId = data.locationId;
                locationData.locationName = data.locationName;
                locationData.zoneId = data.zoneId;
                locationData.zoneName = data.zoneName;

                const txtEl = document.getElementById(`locationBtnText-locationSelectorWrapper`);
                if(txtEl) txtEl.innerText = `${data.locationName} - ${data.zoneName}`;

                closeDynamicPopup();
                renderOrderSummary();
            }
        });
    </script>
</body>
</html>
